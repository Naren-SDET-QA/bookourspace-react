# =============================================================================
# Approved backup target — BookOurSpace React
#
# This is the ONLY project the backup, migration-history and restore-verification
# scripts will accept. It is a separate profile file, not a replacement of the
# legacy Stockholm/Mumbai references: those env snapshots stay on disk untouched
# and are simply not accepted by these scripts.
#
# Tracked by git. Contains no credential and must never contain one.
# Parsed as KEY=value (never sourced as shell), one assignment per line.
#
# Verified against: supabase/.temp/project-ref and supabase/.temp/pooler-url
# (written by the Supabase CLI when it linked project "React").
# =============================================================================

BOS_TARGET_PROFILE=react
BOS_APPROVED_REF=obkfgxjzlscungkhbyvq
BOS_REGION=ap-south-1

# Direct connection. IPv6-only on many client networks; fallback only.
BOS_DIRECT_HOST=db.obkfgxjzlscungkhbyvq.supabase.co
BOS_DIRECT_USER=postgres

# Session pooler (Supavisor). Port 5432 = session mode, which pg_dump requires.
# The username carries the tenant, so it must be postgres.<approved ref>.
BOS_POOLER_HOST=aws-0-ap-south-1.pooler.supabase.com
BOS_POOLER_USER=postgres.obkfgxjzlscungkhbyvq
BOS_DB_PORT=5432
BOS_DB_NAME=postgres
BOS_SSLMODE=require

# refs the scripts must refuse by name, with a targeted message.
# sfoizxarbljhldmkgsma = previous Mumbai project (stale).
# ezrxykyocgbolpaebnqx = legacy Stockholm project (preserved, not a backup target).
BOS_REJECTED_REFS=sfoizxarbljhldmkgsma ezrxykyocgbolpaebnqx

# Defaults (overridable by environment, never stored as secrets).
BOS_BACKUP_ROOT_DEFAULT=~/BookOurSpace_Backups/react
BOS_KEYRING_DEFAULT=/Users/aa/.config/bookourspace/backup-gnupg-recovery-20261106
BOS_BACKUP_GPG_RECIPIENT=E18BA34DE55EEEDA266D35B4B151F3EB267A8E5A
BOS_BACKUP_GPG_PASSPHRASE_SERVICE=bos-backup-gpg-passphrase-recovery-20261106
