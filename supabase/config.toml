project_id = "bookourspace-react-demo"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
# The guarded React seed command installs the existing standalone base schema first.
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55424

[storage]
enabled = true
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3400"
additional_redirect_urls = ["http://localhost:3400"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
