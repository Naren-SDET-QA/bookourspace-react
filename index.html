    <style>
      #bos-prelaunch-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:linear-gradient(160deg,#f7f8fc,#f3f7fa 52%,#f7f5ff);color:#0b1f33;font:800 32px 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.055em}

    <script>
      window.__swReady = (async function () {
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(
              keys.filter(function (k) { return k !== 'crafto-marketplace-data-v2'; }).map(function (k) { return caches.delete(k); })
            );
          }
          if ('serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            if (hadController && !sessionStorage.getItem('__sw_purged_v4')) {
              sessionStorage.setItem('__sw_purged_v4', '1');
              window.location.reload();
              return false;
            }
          }
        } catch (e) {}
        return true;
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-purple-500 selection:text-white">
    <div id="bos-prelaunch-screen" aria-label="Start using BookOurSpace">
      <div class="bos-prelaunch-inner">
        <picture class="bos-prelaunch-logo" role="img" aria-label="BookOurSpace — Find, Book, Enjoy">
          <img src="/assets/brand/bos-logo-lockup.webp" srcset="/assets/brand/bos-logo-lockup-560-5771e9b215e6.webp 560w, /assets/brand/bos-logo-lockup-1120-bea9629c0067.webp 1120w" sizes="(max-width: 622px) 90vw, 560px" width="1560" height="320" alt="" fetchpriority="high" decoding="async" />
        </picture>
        <small id="bos-prelaunch-status">Sign in with Google or browse as a guest.</small>
        <div id="bos-prelaunch-actions" aria-label="Choose how to continue">
          <button id="bos-prelaunch-google" type="button">Continue with Google</button>
          <button id="bos-prelaunch-guest" type="button">Explore Spaces as Guest</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var actions = document.getElementById('bos-prelaunch-actions');
        var status = document.getElementById('bos-prelaunch-status');
        var google = document.getElementById('bos-prelaunch-google');
        var guest = document.getElementById('bos-prelaunch-guest');
        function choose(action) {
          if (!actions || !status || !google || !guest) return;
          google.disabled = true;
          guest.disabled = true;
          actions.setAttribute('aria-busy', 'true');
          status.textContent = action === 'guest' ? 'Opening BookOurSpace…' : 'Opening secure Google sign-in…';
          window.__bosBootEntryAction = action;
          try {
            if (action === 'guest') localStorage.setItem('bos_entry_choice_v1', 'guest');
            else sessionStorage.setItem('bos_boot_auth_requested_v1', '1');
          } catch (e) {}
        }
        google.addEventListener('click', function () { choose('google'); });
        guest.addEventListener('click', function () { choose('guest'); });
      })();
    </script>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
