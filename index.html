    <script>
      window.__swReady = (async function () {
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(
              keys.filter(function (k) { return k !== 'crafto-marketplace-data-v2'; }).map(function (k) { return caches.delete(k); })
            );
          }
          if ('serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            if (hadController && !sessionStorage.getItem('__sw_purged_v4')) {
              sessionStorage.setItem('__sw_purged_v4', '1');
              window.location.reload();
              return false;
            }
          }
        } catch (e) {}
        return true;
      })();
    </script>
