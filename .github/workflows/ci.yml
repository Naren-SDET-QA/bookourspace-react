name: BookOurSpace CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/consolidate-pr1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookourspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Scan added source lines for secrets
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          else
            base_ref="HEAD^"
          fi
          git diff --unified=0 --no-ext-diff "${base_ref}...HEAD" -- . \
            | docker run --rm --network=none -i ghcr.io/gitleaks/gitleaks:v8.24.3 \
                stdin --no-banner --no-color --redact

  chromium:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start preinstalled PostgreSQL service for the disposable harness
        run: |
          sudo systemctl start postgresql.service
          pg_bin_dir="$(pg_config --bindir)"
          test -x "$pg_bin_dir/initdb"
          test -x "$pg_bin_dir/pg_ctl"
          echo "$pg_bin_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the frontend for the browser journey
        run: npm run build

      - name: Verify the browser build exists
        run: test -f dist/index.html

      - name: Run isolated Chromium E2E suite
        env:
          BOS_PLAYWRIGHT_PORT: 4621
          BOS_PLAYWRIGHT_DB_PORT: 14621
          BOS_PLAYWRIGHT_DB_DATA_DIR: /tmp/bookourspace-playwright-db-4621
        run: npm run e2e -- --project=chromium --workers=1 --retries=0

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bookourspace-playwright-results
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
